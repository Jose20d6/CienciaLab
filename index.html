<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuímicaLab</title>
  <meta name="description" content="Aplicación interactiva de química para secundaria: transformaciones físicas y químicas, laboratorio virtual, balanceo de ecuaciones y tabla periódica.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-go="inicio">⚗️ QuímicaLab</button>
    <nav class="tabs" aria-label="Actividades">
      <div class="grupo">
        <button class="grupo-btn" aria-haspopup="true" aria-expanded="false">⚗️ Química <span class="grupo-actual"></span><span class="flecha" aria-hidden="true">▾</span></button>
        <div class="grupo-menu" hidden>
          <button data-go="transformaciones">🔄 Transformaciones</button>
          <button data-go="laboratorio">🧪 Laboratorio</button>
          <button data-go="balanceo">⚖️ Balanceo</button>
          <button data-go="tabla">🧩 Tabla periódica</button>
          <button data-go="atomos">⚛️ Átomos</button>
        </div>
      </div>
      <div class="grupo">
        <button class="grupo-btn" aria-haspopup="true" aria-expanded="false">🌱 Ciencias naturales <span class="grupo-actual"></span><span class="flecha" aria-hidden="true">▾</span></button>
        <div class="grupo-menu" hidden>
          <button data-go="invernadero">🌍 Efecto invernadero</button>
          <button data-go="celula">🔬 Célula</button>
          <button data-go="ciclos">♻️ Ciclos</button>
          <button data-go="biomoleculas">🧬 Biomoléculas</button>
          <button data-go="alimentacion">🥗 Alimentación saludable</button>
          <button data-go="nutricion">🫀 Sistemas de la nutrición</button>
        </div>
      </div>
    </nav>
    <button id="btn-tema" class="ghost" title="Cambiar entre modo claro y oscuro" aria-label="Cambiar entre modo claro y oscuro">🌙</button>
    <button id="btn-proyector" class="ghost" title="Modo proyector: agranda los textos para proyectar en el aula" aria-label="Modo proyector">📽️</button>
  </header>

  <main>
    <section id="inicio" class="view">
      <div class="hero">
        <h1>Laboratorio interactivo de Química y Ciencias Naturales</h1>
        <p>Explora, experimenta y ponte a prueba. Elige una actividad para comenzar.</p>
      </div>

      <h2 class="seccion-inicio">⚗️ Química</h2>
      <div class="tarjetas-inicio">
        <button class="tarjeta-modulo" data-go="transformaciones">
          <span class="tm-emoji">🔄</span>
          <h2>¿Físico o químico?</h2>
          <p>Analiza situaciones de la vida cotidiana y decide qué tipo de transformación ocurre.</p>
          <span class="etiqueta">Transformaciones de la materia</span>
        </button>
        <button class="tarjeta-modulo" data-go="laboratorio">
          <span class="tm-emoji">🧪</span>
          <h2>Laboratorio virtual</h2>
          <p>Mezcla reactivos, observa lo que pasa y descubre las evidencias de una reacción química.</p>
          <span class="etiqueta">Reacciones químicas</span>
        </button>
        <button class="tarjeta-modulo" data-go="balanceo">
          <span class="tm-emoji">⚖️</span>
          <h2>Balanceo de ecuaciones</h2>
          <p>Ajusta los coeficientes hasta que la balanza quede equilibrada. ¡Nada se pierde, todo se transforma!</p>
          <span class="etiqueta">Ecuaciones químicas</span>
        </button>
        <button class="tarjeta-modulo" data-go="tabla">
          <span class="tm-emoji">🧩</span>
          <h2>Tabla periódica</h2>
          <p>Explora los 118 elementos, sus propiedades y su estructura. Luego acepta el desafío.</p>
          <span class="etiqueta">Tabla periódica</span>
        </button>
        <button class="tarjeta-modulo" data-go="atomos">
          <span class="tm-emoji">⚛️</span>
          <h2>Átomos y moléculas</h2>
          <p>Arma átomos, isótopos e iones con protones, neutrones y electrones. Después une átomos para formar moléculas.</p>
          <span class="etiqueta">Estructura de la materia</span>
        </button>
      </div>

      <h2 class="seccion-inicio">🌱 Ciencias naturales</h2>
      <div class="tarjetas-inicio">
        <button class="tarjeta-modulo" data-go="invernadero">
          <span class="tm-emoji">🌍</span>
          <h2>Efecto invernadero</h2>
          <p>Aumenta o reduce el CO₂ del aire y mira cómo cambia la temperatura de la Tierra a lo largo de los años.</p>
          <span class="etiqueta">Cambio climático</span>
        </button>
        <button class="tarjeta-modulo" data-go="celula">
          <span class="tm-emoji">🔬</span>
          <h2>Explorador de la célula</h2>
          <p>Acércate a una célula animal o vegetal, descubre la función de cada orgánulo y compara ambas.</p>
          <span class="etiqueta">La célula</span>
        </button>
        <button class="tarjeta-modulo" data-go="ciclos">
          <span class="tm-emoji">♻️</span>
          <h2>Ciclos de la naturaleza</h2>
          <p>Sigue el viaje de una gota de agua, un átomo de carbono o de nitrógeno, y ordena las etapas de cada ciclo.</p>
          <span class="etiqueta">Ciclos biogeoquímicos</span>
        </button>
        <button class="tarjeta-modulo" data-go="biomoleculas">
          <span class="tm-emoji">🧬</span>
          <h2>Biomoléculas</h2>
          <p>Arma polisacáridos, proteínas, lípidos y ADN, sigue el camino del gen a la proteína, experimenta con enzimas y analiza muestras en el laboratorio.</p>
          <span class="etiqueta">Química de la vida</span>
        </button>
        <button class="tarjeta-modulo" data-go="alimentacion">
          <span class="tm-emoji">🥗</span>
          <h2>Alimentación saludable</h2>
          <p>Explora la pirámide nutricional, el óvalo y el plato de las Guías Alimentarias argentinas, y armá un día de comidas equilibrado.</p>
          <span class="etiqueta">Nutrición</span>
        </button>
        <button class="tarjeta-modulo" data-go="nutricion">
          <span class="tm-emoji">🫀</span>
          <h2>Sistemas de la nutrición</h2>
          <p>Descubrí cómo los sistemas digestivo, respiratorio, circulatorio y excretor trabajan juntos para nutrir a cada célula.</p>
          <span class="etiqueta">Cuerpo humano</span>
        </button>
      </div>
    </section>

    <section id="transformaciones" class="view" hidden></section>
    <section id="laboratorio" class="view" hidden></section>
    <section id="balanceo" class="view" hidden></section>
    <section id="tabla" class="view" hidden></section>
    <section id="atomos" class="view" hidden></section>
    <section id="invernadero" class="view" hidden></section>
    <section id="celula" class="view" hidden></section>
    <section id="ciclos" class="view" hidden></section>
    <section id="biomoleculas" class="view" hidden></section>
    <section id="alimentacion" class="view" hidden></section>
    <section id="nutricion" class="view" hidden></section>
  </main>

  <script src="js/util.js"></script>
  <script src="js/arte.js"></script>
  <script src="js/datos/elementos.js"></script>
  <script src="js/transformaciones.js"></script>
  <script src="js/laboratorio.js"></script>
  <script src="js/balanceo.js"></script>
  <script src="js/tabla.js"></script>
  <script src="js/atomos.js"></script>
  <script src="js/invernadero.js"></script>
  <script src="js/celula.js"></script>
  <script src="js/ciclos.js"></script>
  <script src="js/biomoleculas.js"></script>
  <script src="js/alimentacion.js"></script>
  <script src="js/nutricion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
